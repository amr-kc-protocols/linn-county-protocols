<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B3A5C">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Protocol Quiz · Linn County EMS 2026</title>
<link rel="stylesheet" href="quiz-kit.css">
<style>
/* Linn County colors: navy and crimson, matching the field guide */
:root{
  --qk-bg:#EAEFF5; --qk-surface:#FFFFFF; --qk-surface2:#F5F7FA; --qk-line:#D3DDE8;
  --qk-ink:#12283F; --qk-muted:#4E6278; --qk-accent:#1B3A5C; --qk-accent-ink:#FFFFFF;
  --qk-accent2:#C8394C; --qk-hero1:#12283F; --qk-hero2:#27506F;
  --qk-emt:#2E7D5B; --qk-aemt:#2F6FAD; --qk-pm:#9B2335;
}
.qk-bar{border-bottom-color:#9B2335}
</style>
</head>
<body>
<div id="quiz"></div>
<script src="quiz-bank.js"></script>
<script src="quiz-kit.js"></script>
<script>
QuizKit.mount(document.getElementById('quiz'), {
  appName: 'Linn County EMS',
  title: 'Protocol Quiz',
  subtitle: '2026 Medical Protocols',
  homeHref: 'index.html',
  homeLabel: 'Protocols',
  mode: 'full',
  storageKey: 'linn_quiz_v2',
  banks: QUIZ_BANK,
  levels: [
    { id: 'emt',  label: 'EMT',       banks: ['emt'],
      blurb: 'Scope, airway, hemorrhage control, cardiac, stroke, trauma, pediatrics and EMT medications.' },
    { id: 'aemt', label: 'AEMT',      banks: ['emt', 'aemt'],
      blurb: 'Everything in EMT plus IV/IO, AEMT medications, cardiac arrest drugs and AEMT decision-making.' },
    { id: 'pm',   label: 'Paramedic', banks: ['emt', 'aemt', 'pm'],
      blurb: 'Every level, plus MAI, pharmacology, ketorolac, toxicology and critical care decisions.' }
  ]
});
</script>
</body>
</html>
