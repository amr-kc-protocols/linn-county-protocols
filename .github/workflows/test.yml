name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  doses:
    name: Dose math
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # No dependencies — the suite uses node:test and node:assert only.
      - run: npm test
